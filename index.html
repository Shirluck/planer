<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: media:; media-src media:; font-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Планер</title>
<style>
:root{
  --bg:#f3f1ec; --panel:#fffdfa; --panel-2:#f8f6f1; --line:#e8e4dc; --line-2:#d6d1c6;
  --text:#25221e; --muted:#6f6a63; --faint:#b5afa5; --hover:#f2efe9;
  --p1:#2f6fe0; --p2:#c97f00; --p3:#d93a40;
  --c-day:#0b8a80; --c-week:#5156d6; --c-plans:#c0602f; --c-ideas:#a145b8;
  --shadow:0 1px 2px rgba(37,34,30,.06),0 6px 18px rgba(37,34,30,.05);
  --ink:#25221e; --ink-text:#fffdfa;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#131210; --panel:#1b1916; --panel-2:#211f1b; --line:#2c2924; --line-2:#3c3831;
    --text:#ece8e0; --muted:#9a9388; --faint:#5e5950; --hover:#24221e;
    --p1:#6ea0ff; --p2:#e8a43a; --p3:#ff6b6f;
    --c-day:#36c2b6; --c-week:#8a8eff; --c-plans:#ee8f5c; --c-ideas:#cf7ee3;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
    --ink:#ece8e0; --ink-text:#1b1916;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--p1);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

#app{height:100vh;height:100dvh;min-height:560px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px 10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.logo{width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.logo i{border-radius:3px;display:block}
.logo i:nth-child(1){background:var(--c-day)}.logo i:nth-child(2){background:var(--c-week)}
.logo i:nth-child(3){background:var(--c-plans)}.logo i:nth-child(4){background:var(--c-ideas)}
.spacer{flex:1}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status[data-s=ok]::before{background:#2fa36b}
.status[data-s=busy]::before{background:var(--p2)}
.status[data-s=warn]::before{background:var(--p2)}
.status[data-s=err]::before{background:var(--p3)}
.ai-btn{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;background:var(--ink);color:var(--ink-text);font-weight:600;font-size:13px}
.ai-btn:hover{opacity:.9}
.banner{margin:0 18px 8px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--p2) 16%,var(--panel));border:1px solid color-mix(in srgb,var(--p2) 40%,transparent);font-size:13px}

.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:0 14px 14px;transition:opacity .2s}
.board.loading{opacity:.45;pointer-events:none}
.col{--accent:var(--c-day);background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow);overflow:hidden}
.col[data-key=week]{--accent:var(--c-week)}
.col[data-key=plans]{--accent:var(--c-plans)}
.col[data-key=ideas]{--accent:var(--c-ideas)}
.col::before{content:"";height:3px;background:var(--accent);flex:none}
.col-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 12px 0 16px}
.col-title{display:flex;align-items:center;gap:9px;min-width:0}
.col-title h2{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.ico{color:var(--accent);display:grid;place-items:center}
.col-tools{display:flex;gap:2px}
.tool{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.tool:hover{background:var(--hover);color:var(--text)}
.tool[aria-pressed=true]{color:var(--accent)}
.col-sub{padding:2px 16px 0;color:var(--muted);font-size:12.5px;min-height:19px}
.dows{display:flex;gap:3px;margin-top:2px}
.dows span{font-size:11px;padding:1px 6px;border-radius:6px;color:var(--muted)}
.dows span.today{background:var(--accent);color:#fff;font-weight:600}
.prog{display:flex;align-items:center;gap:10px;padding:10px 16px 6px}
.bar{flex:1;height:5px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;transition:width .3s}
.prog .n{font-size:12px;color:var(--muted);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.list{flex:1;min-height:0;overflow:auto;padding:4px 8px 8px;scrollbar-width:thin}
.empty{color:var(--muted);text-align:center;padding:28px 18px;font-size:13px}

/* task item */
.item{position:relative;display:grid;grid-template-columns:14px 22px minmax(0,1fr) auto;column-gap:6px;align-items:start;padding:6px 6px 6px 2px;border-radius:10px}
.item:hover,.item:focus-within{background:var(--hover)}
.item.dragging{opacity:.4}
.item.drop-before::after,.list.drop-end::after{content:"";position:absolute;left:8px;right:8px;top:-1px;height:2px;border-radius:2px;background:var(--accent)}
.list.drop-end{position:relative}
.list.drop-end::after{top:auto;bottom:4px}
.item[data-pri="1"]::before,.item[data-pri="2"]::before,.item[data-pri="3"]::before{content:"";position:absolute;left:-1px;top:9px;bottom:9px;width:3px;border-radius:3px}
.item[data-pri="1"]::before{background:var(--p1)}.item[data-pri="2"]::before{background:var(--p2)}.item[data-pri="3"]::before{background:var(--p3)}
.grip{height:22px;display:grid;place-items:center;color:var(--faint);cursor:grab;opacity:0}
.item:hover .grip{opacity:1}
.cb{width:20px;height:20px;margin-top:1px;border:1.6px solid var(--line-2);border-radius:6px;display:grid;place-items:center;color:transparent;background:var(--panel);transition:background .15s,border-color .15s}
.cb:hover{border-color:var(--accent)}
.cb[aria-checked=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.txt{display:block;width:100%;border:0;background:transparent;resize:none;outline:none;padding:1px 0;line-height:1.45;overflow:hidden;min-height:22px}
.item.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.acts{display:flex;align-items:center;gap:1px}
.acts>button{min-width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--muted);opacity:0;transition:opacity .12s}
.acts>button:hover{background:var(--line)}
.item:hover .acts>button,.item:focus-within .acts>button{opacity:1}
.item:not([data-pri="0"]) .acts .pri,.item.has-note .acts .note-btn{opacity:1}
.pri{font-weight:700;font-size:12px;letter-spacing:-1px;padding:0 5px}
.item[data-pri="1"] .pri{color:var(--p1);background:color-mix(in srgb,var(--p1) 14%,transparent)}
.item[data-pri="2"] .pri{color:var(--p2);background:color-mix(in srgb,var(--p2) 16%,transparent)}
.item[data-pri="3"] .pri{color:var(--p3);background:color-mix(in srgb,var(--p3) 14%,transparent)}
.item.has-note .note-btn{color:var(--accent)}
.note-wrap{grid-column:3 / -1;display:none;margin-top:1px}
.item.has-note .note-wrap,.item.note-open .note-wrap{display:block}
.note{display:none;width:100%;resize:none;outline:none;overflow:hidden;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;line-height:1.45}
.note:focus{border-color:var(--accent)}
.note-prev{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
.item.note-open .note{display:block}
.item.note-open .note-prev{display:none}

.composer{display:flex;align-items:center;gap:8px;margin:0 10px 10px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);color:var(--muted)}
.composer:focus-within{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.add-input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text)}
.add-input::placeholder{color:var(--muted)}

/* tree */
.node{display:flex;align-items:center;gap:6px;padding:5px 4px 5px calc(6px + var(--d,0) * 18px);border-radius:9px;cursor:pointer;min-height:34px}
.node:hover{background:var(--hover)}
.caret{width:18px;height:18px;display:grid;place-items:center;color:var(--muted);transition:transform .15s;flex:none}
.node.open .caret{transform:rotate(90deg)}
.n-ico{color:var(--accent);flex:none;display:grid;place-items:center}
.page .n-ico{color:var(--muted)}
.page .caret{visibility:hidden}
.n-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder .n-title{font-weight:600}
.n-title.ph{color:var(--muted)}
.n-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.n-acts{display:flex;gap:1px;flex:none}
.n-acts button{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--muted);opacity:0}
.n-acts button:hover{background:var(--line);color:var(--text)}
.node:hover .n-acts button,.node:focus-within .n-acts button{opacity:1}
.rename{flex:1;min-width:0;border:1px solid var(--accent);border-radius:6px;padding:2px 6px;background:var(--panel);outline:none}
.node-empty{color:var(--muted);font-size:12.5px;padding:4px 8px 6px calc(32px + var(--d,0) * 18px)}

/* menu */
.menu{position:fixed;z-index:100;min-width:210px;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.2);padding:5px}
.menu-it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13.5px}
.menu-it:hover{background:var(--hover)}
.menu-it svg{color:var(--muted);flex:none}
.menu-it.danger,.menu-it.danger svg{color:var(--p3)}
.menu-sep{height:1px;background:var(--line);margin:4px 2px}

/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:120;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--ink-text);padding:10px 16px;border-radius:12px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:92vw}
.toast button{font-weight:700;text-decoration:underline}

/* page editor */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,18,14,.45);display:grid;place-items:center;padding:20px}
.sheet{width:min(780px,100%);height:min(86vh,860px);background:var(--panel);border-radius:18px;border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden;--accent:var(--c-plans)}
.sheet[data-key=ideas]{--accent:var(--c-ideas)}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap}
.crumbs b{color:var(--accent);font-weight:600}
.crumbs span{overflow:hidden;text-overflow:ellipsis}
.sheet-body{flex:1;min-height:0;overflow:auto;padding:26px clamp(18px,6vw,56px) 40px}
.title-in{width:100%;border:0;outline:0;background:transparent;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:0 0 14px;padding:0}
.title-in::placeholder{color:var(--faint)}
.blk{display:grid;grid-template-columns:20px 26px minmax(0,1fr);align-items:start;border-radius:8px}
.blocks{margin-left:-20px}
.t-p,.t-h{grid-template-columns:20px minmax(0,1fr)}
.t-p .b-gap,.t-h .b-gap{display:none}
.b-menu{height:28px;display:grid;place-items:center;color:var(--faint);opacity:0;cursor:pointer}
.blk:hover .b-menu,.blk:focus-within .b-menu{opacity:1}
.b-gap{display:block}
.b-bul{height:28px;display:grid;place-items:center;font-size:18px;color:var(--muted)}
.b-cb{margin:4px 0 0 2px}
.b-in{display:block;width:100%;border:0;outline:0;background:transparent;resize:none;overflow:hidden;padding:3px 0;line-height:1.55;font-size:15.5px;min-height:28px}
.b-in::placeholder{color:transparent}
.b-in:focus::placeholder,.blk.only .b-in::placeholder{color:var(--faint)}
.t-h .b-in{font-size:20px;font-weight:650;letter-spacing:-.01em;padding-top:10px}
.t-h .b-menu{height:40px}
.blk.done .b-in{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.pad{height:120px;cursor:text}
.sheet-foot{display:flex;justify-content:space-between;gap:12px;padding:9px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);flex-wrap:wrap}
kbd{font:inherit;font-size:11.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:0 5px}

/* ai panel */
.ai{position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);z-index:70;background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.18);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease;visibility:hidden}
.ai.open{transform:none;visibility:visible}
.ai-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 12px 18px;border-bottom:1px solid var(--line)}
.ai-head h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.ai-msgs{flex:1;min-height:0;overflow:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;line-height:1.5;font-size:14px}
.msg.user{align-self:flex-end;background:var(--ink);color:var(--ink-text);padding:8px 13px;border-radius:14px 14px 4px 14px;white-space:pre-wrap}
.msg.bot{align-self:flex-start}
.msg.bot p{margin:0 0 8px}.msg.bot ul{margin:0 0 8px;padding-left:20px}.msg.bot li{margin:2px 0}
.msg.bot code{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:0 4px;font-size:12.5px}
.msg .acts-log{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.act{font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:flex-start;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:5px 9px}
.act svg{color:var(--c-day);flex:none;margin-top:2px}
.thinking{color:var(--muted)}
.thinking::after{content:"…";animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.2}}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 8px}
.chip{font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line-2);color:var(--text);background:var(--panel-2)}
.chip:hover{background:var(--hover)}
.ai-form{display:flex;align-items:flex-end;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--line)}
.ai-in{flex:1;resize:none;max-height:140px;min-height:40px;border:1px solid var(--line-2);border-radius:12px;padding:9px 12px;background:var(--panel-2);outline:none;line-height:1.4}
.ai-in:focus{border-color:var(--ink)}
.send{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--ink-text);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.4}

@media (hover:none){
  .acts>button,.n-acts button,.b-menu{opacity:1}
  .grip{opacity:0}
}
@media (max-width:1040px){
  .board{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding-bottom:14px}
  .col{flex:0 0 min(88vw,400px);scroll-snap-align:center}
  .overlay{padding:0}
  .sheet{height:100%;border-radius:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Планер</div>
    <div class="spacer"></div>
    <div class="status" id="status" data-s="busy" role="status" aria-live="polite">Загрузка…</div>
    <button class="ai-btn" id="aiBtn" type="button" hidden></button>
  </header>
  <div class="banner" id="banner" hidden></div>
  <main class="board loading" id="board"></main>
</div>
<aside class="ai" id="aiPanel" aria-label="ИИ-ассистент"></aside>

<script src="shim.js"></script>
<script src="src/sketch.js"></script>
<script src="src/board.js"></script>

const backend = { kind:'memory', db:null, uid:null, refs:{} };

const statusEl = $('#status');
function setStatus(kind){
  const map = {
    loading:['Загрузка…', 'busy'], saving:['Сохраняю…', 'busy'], saved:['Сохранено', 'ok'],
    local:['Сохранено в этом браузере', 'warn'], memory:['Не сохраняется', 'err'], error:['Ошибка сохранения', 'err']

async function initBackend(){
  let db = null, uid = null;
  try {
    if (window.claude && window.claude.use) {
      db = await window.claude.use('db');
      const user = await window.claude.use('user');
      uid = user ? await user.id() : null;
    }
  } catch (e) { db = null; }
  if (db && uid) { backend.kind = 'db'; backend.db = db; backend.uid = uid; return; }
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); backend.kind = 'local'; }
  catch (e) { backend.kind = 'memory'; }
}
function loadAll(){
  return new Promise(resolve => {
    if (backend.kind === 'db') {
      const col = backend.db.collection('data/users/' + backend.uid);
      let pending = KEYS.length, finished = false;
      const finish = () => { if (!finished) { finished = true; clearTimeout(tm); resolve(); } };
      const tm = setTimeout(() => { showBanner('Хранилище отвечает медленно — данные могут быть неактуальными. Не закрывайте страницу.'); finish(); }, 10000);
      KEYS.forEach(k => {
        let first = true;
        const ref = col.doc('planner-' + k);
        backend.refs[k] = ref;
        ref.onSnapshot(snap => {
          onRemote(k, snap);
          if (first && !snap.metadata.fromCache) { first = false; if (--pending === 0) finish(); }
        }, err => {
          showBanner('Не удалось загрузить данные (' + (err && err.code) + ').');
          if (first) { first = false; if (--pending === 0) finish(); }
        });
      });
    } else {
      KEYS.forEach(k => {
        try { const raw = localStorage.getItem('planner1-' + k); if (raw) S[k] = normalize(k, JSON.parse(raw)); } catch (e) {}
      });
      resolve();
    }
  });
}
function onRemote(k, snap){
  if (!snap.exists) return;
  const d = snap.data();
  if (snap.metadata.hasPendingWrites || dirty.has(k) || writing[k]) return;
  if (stable(d) === lastSaved[k]) return;
  if (loaded && isTyping()) { pendingRemote[k] = d; return; }
  applyRemote(k, d);
}
function applyRemote(k, d){
  S[k] = normalize(k, clone(d));

}
const isTyping = () => { const a = document.activeElement; return !!(a && a.matches && a.matches('textarea,input')); };
document.addEventListener('focusout', () => setTimeout(() => {

}, 60));

function touch(k){

}
async function flush(k){
  if (!dirty.has(k)) return;
  if (writing[k]) { again[k] = true; return; }
  writing[k] = true; dirty.delete(k);
  try {
    const body = clone(S[k]);
    const json = JSON.stringify(body);
    lastSaved[k] = stable(body);
    if (backend.kind === 'db') {
      if (!window.electronAPI && new Blob([json]).size > 235000) toast('Этот раздел почти достиг лимита размера (256 КБ). Удалите лишнее или разнесите по другим разделам.');
      await backend.refs[k].set(body);
    } else if (backend.kind === 'local') {
      localStorage.setItem('planner1-' + k, json);
    }
    showBanner('');
  } catch (e) {
    setStatus('error');
    showBanner('Не удалось сохранить: ' + ((e && (e.code || e.message)) || 'ошибка') + '. Изменения остаются на экране; попробуйте ещё раз после следующей правки.');
    writing[k] = false; return;
  }
  writing[k] = false;
  if (again[k] || dirty.has(k)) { again[k] = false; clearTimeout(timers[k]); timers[k] = setTimeout(() => flush(k), 300); }
  else if (!dirty.size && !Object.values(writing).some(Boolean) && !extraPending.size) idleStatus();

// Дописать всё несохранённое (перед закрытием окна): разделы и доски.

}

let drag = null;

  aiMsgs = h('div', { class:'ai-msgs', 'aria-live':'polite' });
  aiIn = h('textarea', { class:'ai-in', rows:'1', placeholder:'Спросите или поручите что-нибудь…', 'aria-label':'Сообщение ассистенту' });
  aiSendBtn = h('button', { class:'send', type:'submit', 'aria-label':'Отправить' }, icon('up', 18));
  const chips = ['Составь план на сегодня из задач недели', 'Что самое важное сделать сейчас?', 'Разбери мои идеи: что стоит превратить в план?', 'Подведи итог дня'];
  aiChips = h('div', { class:'chips' }, chips.map(c => h('button', { class:'chip', type:'button', onclick:() => aiSend(c) }, c)));
  aiPanel.append(
    h('div', { class:'ai-head' }, h('h3', {}, icon('spark', 18), 'Ассистент'), tool('x', 'Закрыть', closeAi)),
    aiMsgs, aiChips,
    h('form', { class:'ai-form', onsubmit:e => { e.preventDefault(); if (aiBusy) { aiCtrl && aiCtrl.abort(); return; } const v = aiIn.value.trim(); if (v) { aiIn.value = ''; autosize(aiIn); aiSend(v); } } }, aiIn, aiSendBtn));
  aiIn.addEventListener('input', () => autosize(aiIn));
  aiIn.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); aiSendBtn.click(); } });
  addMsg('bot', 'Я вижу ваши списки и могу их менять: добавлять задачи, расставлять приоритеты, переносить между «Сегодня» и «Неделя», создавать страницы в «Основных планах» и «Идеях». Могу читать доски задач и добавлять на них заметки и чек-листы, а картинки посмотрю, если попросите. Просто напишите, что нужно.');
}
function openAi(){ aiPanel.classList.add('open'); aiPanel.removeAttribute('inert'); setTimeout(() => aiIn.focus(), 220); }
function closeAi(){ aiPanel.classList.remove('open'); }
function addMsg(role, text){
  const m = h('div', { class:'msg ' + role });
  if (role === 'user') m.textContent = text;
  else { m.append(h('div', { class:'acts-log' }), h('div', { class:'md' })); m.querySelector('.md').innerHTML = mdLite(text); }
  aiMsgs.append(m); aiMsgs.scrollTop = aiMsgs.scrollHeight; return m;
}
function ctxTasks(k){
  const it = S[k].items; if (!it.length) return '(пусто)';
  return it.map(t => '[' + t.id + '] ' + (t.done ? '[x]' : '[ ]') + ' ' + (t.pri ? '(приоритет ' + t.pri + ') ' : '') + t.text + (t.note.trim() ? ' — заметка: ' + t.note.replace(/\s+/g, ' ').slice(0, 200) : '') + (t.boardCount ? ' {доска: карточек ' + t.boardCount + '}' : '')).join('\n');
}
function ctxTree(k){
  const out = [];
  const walk = (arr, d) => arr.forEach(n => {
    if (out.length > 200) return;
    const pad = '  '.repeat(d);
    if (n.type === 'folder') { out.push(pad + '[' + n.id + '] папка «' + n.title + '»'); walk(n.children, d + 1); }
    else { const td = n.blocks.filter(b => b.t === 'todo'); out.push(pad + '[' + n.id + '] страница «' + (n.title || 'Без названия') + '» (блоков: ' + n.blocks.length + (td.length ? ', чекбоксов выполнено ' + td.filter(b => b.done).length + '/' + td.length : '') + ')'); }
  });
  walk(S[k].nodes, 0); return out.join('\n') || '(пусто)';
}
function buildPrompt(userText){
  const now = new Intl.DateTimeFormat('ru-RU', { dateStyle:'full', timeStyle:'short' }).format(new Date());
  return 'Ты — встроенный ИИ-ассистент личного планировщика. Отвечай по-русски, коротко и по делу, без лишних вступлений.\n' +
    'Ты можешь менять данные планировщика через инструменты: добавлять, менять, переносить задачи; читать и создавать страницы. ' +
    'Если пользователь просит что-то сделать, добавить, запланировать или разложить — делай это инструментами, а не только советуй. ' +
    'Если просит совет или анализ — просто ответь. Ничего не удаляй без прямой просьбы. После действий в одну-две фразы скажи, что сделано. ' +
    'Приоритет задачи: 0 — нет, 1 — низкий, 2 — средний, 3 — высокий. Идентификаторы в квадратных скобках — это id для инструментов. ' +
    'Заметки к задаче короткие. Содержимое страниц смотри через read_page.\n' +
    'У задач в «Сегодня» и «Неделе» есть доски — холст с карточками (заметки, чек-листы, фото, видео, зарисовки, ссылки); у каких задач доска не пустая, видно по пометке {доска: …}. ' +
    'Содержимое доски читай через read_board(taskId); добавить заметку или чек-лист на доску — add_board_card. ' +
    'Изображения и зарисовки смотри через look_at_image(cardId) только когда пользователь прямо просит посмотреть, описать или разобрать картинку.\n' +
    (boardApi && boardApi.openTaskId() ? 'Сейчас у пользователя открыта доска задачи [' + boardApi.openTaskId() + '].\n' : '') +
    'Сейчас: ' + now + '.\n\n<состояние>\n' +
    '== СЕГОДНЯ ==\n' + ctxTasks('day') + '\n\n== НЕДЕЛЯ ==\n' + ctxTasks('week') + '\n\n== ОСНОВНЫЕ ПЛАНЫ (папки и страницы) ==\n' + ctxTree('plans') +
    '\n\n== ИДЕИ (папки и страницы) ==\n' + ctxTree('ideas') + '\n</состояние>\n\nЗапрос пользователя: ' + userText;
}
function toBlocks(arr){
  return (Array.isArray(arr) ? arr : []).slice(0, 200).map(b => newBlock(BLOCK_TYPES.includes(b && b.type) ? b.type : 'p', String((b && b.text) || '').slice(0, 2000))).map((b, i) => { b.done = !!(arr[i] && arr[i].done) && b.t === 'todo'; return b; });
}
function aiTools(logEl){
  const log = (ic, text, img) => { logEl.append(h('div', { class:'act' }, icon(ic, 14), h('span', {}, text, img ? h('img', { class:'act-thumb', src:img, alt:'' }) : null))); aiMsgs.scrollTop = aiMsgs.scrollHeight; };
  const boardTask = id => { if (!boardApi) throw new Error('Boards are not available'); const loc = findTask(String(id || '')); if (!loc) throw new Error('Task not found: ' + id); return loc.t; };
  const listOk = l => { if (l !== 'day' && l !== 'week') throw new Error('list must be "day" or "week"'); return l; };
  const taskOrThrow = id => { const loc = findTask(id); if (!loc) throw new Error('Task not found: ' + id); return loc; };
  const T = (name, description, properties, required, fn) => ({ name, description, inputSchema:{ type:'object', properties, required }, execute: async i => fn(i || {}) });
  const LBL = { day:'«Сегодня»', week:'«Неделя»' };
  return [
    T('add_task', 'Add a task to the "day" (today) or "week" list.', { list:{ type:'string', enum:['day', 'week'] }, text:{ type:'string' }, priority:{ type:'integer', minimum:0, maximum:3 }, note:{ type:'string' } }, ['list', 'text'], i => {
      const k = listOk(i.list), text = String(i.text || '').trim(); if (!text) throw new Error('text is empty');
      const t = { id:newId(), text:text.slice(0, 500), done:false, pri:Math.min(3, Math.max(0, i.priority | 0)), note:String(i.note || '').slice(0, 1000) };
      S[k].items.push(t); touch(k); refreshTasks(k); log('plus', 'Добавлено в ' + LBL[k] + ': ' + t.text); return { ok:true, id:t.id };
    }),
    T('update_task', 'Change a task: text, priority 0-3, note, done flag.', { id:{ type:'string' }, text:{ type:'string' }, priority:{ type:'integer', minimum:0, maximum:3 }, note:{ type:'string' }, done:{ type:'boolean' } }, ['id'], i => {
      const loc = taskOrThrow(i.id), t = loc.t;
      if (typeof i.text === 'string' && i.text.trim()) t.text = i.text.trim().slice(0, 500);
      if (i.priority != null) t.pri = Math.min(3, Math.max(0, i.priority | 0));
      if (typeof i.note === 'string') t.note = i.note.slice(0, 1000);
      if (typeof i.done === 'boolean') t.done = i.done;
      touch(loc.k); refreshTasks(loc.k); log('check', 'Обновлено: ' + t.text); return { ok:true };
    }),
    T('move_task', 'Move a task to the other list.', { id:{ type:'string' }, to:{ type:'string', enum:['day', 'week'] } }, ['id', 'to'], i => {
      const loc = taskOrThrow(i.id), to = listOk(i.to), t = loc.t;
      if (loc.k !== to) { S[loc.k].items.splice(loc.i, 1); S[to].items.push(t); touch(loc.k); touch(to); refreshTasks(loc.k); refreshTasks(to); log('arrow', 'Перенесено в ' + LBL[to] + ': ' + t.text); }
      return { ok:true };
    }),
    T('delete_task', 'Delete a task. Only when the user explicitly asks.', { id:{ type:'string' } }, ['id'], i => {
      const loc = taskOrThrow(i.id); S[loc.k].items.splice(loc.i, 1); touch(loc.k); refreshTasks(loc.k); log('trash', 'Удалено: ' + loc.t.text); return { ok:true };
    }),
    T('read_page', 'Read the full content of a page from "plans" or "ideas" by id.', { id:{ type:'string' } }, ['id'], i => {
      const l = findAnyNode(i.id); if (!l || l.node.type !== 'page') throw new Error('Page not found: ' + i.id);
      return { title:l.node.title, blocks:l.node.blocks.map(b => ({ type:b.t, text:b.text, done:b.done })) };
    }),
    T('create_page', 'Create a page in "plans" or "ideas". folder is a top-level folder title (created if missing). Block types: p, h, todo, ul.', { section:{ type:'string', enum:['plans', 'ideas'] }, folder:{ type:'string' }, title:{ type:'string' }, blocks:{ type:'array', items:{ type:'object', properties:{ type:{ type:'string', enum:BLOCK_TYPES }, text:{ type:'string' }, done:{ type:'boolean' } }, required:['text'] } } }, ['section', 'title'], i => {
      const k = i.section; if (k !== 'plans' && k !== 'ideas') throw new Error('section must be plans or ideas');
      let arr = S[k].nodes;
      if (i.folder && String(i.folder).trim()) {
        const nm = String(i.folder).trim().toLowerCase();
        let f = S[k].nodes.find(n => n.type === 'folder' && n.title.trim().toLowerCase() === nm);
        if (!f) { f = { id:newId(), type:'folder', title:String(i.folder).trim().slice(0, 120), open:true, children:[] }; S[k].nodes.push(f); }
        f.open = true; arr = f.children;
      }
      const page = { id:newId(), type:'page', title:String(i.title || '').trim().slice(0, 160), blocks:toBlocks(i.blocks) };
      if (!page.blocks.length) page.blocks.push(newBlock('p'));
      arr.push(page); touch(k); refreshTree(k); log('file', 'Создана страница в «' + SECTIONS[k].title + '»: ' + (page.title || 'Без названия')); return { ok:true, id:page.id };
    }),
    T('append_to_page', 'Append blocks to the end of an existing page.', { id:{ type:'string' }, blocks:{ type:'array', items:{ type:'object', properties:{ type:{ type:'string', enum:BLOCK_TYPES }, text:{ type:'string' }, done:{ type:'boolean' } }, required:['text'] } } }, ['id', 'blocks'], i => {
      const l = findAnyNode(i.id); if (!l || l.node.type !== 'page') throw new Error('Page not found: ' + i.id);
      const nb = toBlocks(i.blocks); const bl = l.node.blocks;
      if (bl.length === 1 && !bl[0].text) bl.length = 0;
      l.node.blocks.push(...nb); touch(l.k); refreshTree(l.k); if (editing && editing.id === i.id) editorSync();
      log('file', 'Дополнена страница: ' + (l.node.title || 'Без названия')); return { ok:true, added:nb.length };
    }),
    T('read_board', 'Read all cards on the board of a task from "day" or "week": notes (text), checklists (title, items), images/videos (file name, caption), sketches, links. Card ids are needed for look_at_image.', { taskId:{ type:'string' } }, ['taskId'], async i => {
      const t = boardTask(i.taskId);
      const cards = await boardApi.readBoard(t.id);
      log('board', 'Прочитана доска: ' + t.text + ' (карточек: ' + cards.length + ')');
      return { task:t.text, cards };
    }),
    T('add_board_card', 'Add a note or a checklist card to the board of a task. For type "checklist": if text has several lines, the first line is the title and every other line is an item ("[x] " prefix = done). x/y are optional board coordinates; without them the card is placed in free space without overlapping other cards.', { taskId:{ type:'string' }, type:{ type:'string', enum:['note', 'checklist'] }, text:{ type:'string' }, x:{ type:'number' }, y:{ type:'number' } }, ['taskId', 'type', 'text'], async i => {
      const t = boardTask(i.taskId), text = String(i.text || '').trim(); if (!text) throw new Error('text is empty');
      const it = await boardApi.addCard(t.id, i.type === 'checklist' ? 'checklist' : 'note', text.slice(0, 8000), i.x, i.y);
      log('board', (it.type === 'checklist' ? 'Чек-лист' : 'Заметка') + ' добавлен' + (it.type === 'checklist' ? '' : 'а') + ' на доску «' + t.text + '»');
      return { ok:true, id:it.id };
    }),
    T('look_at_image', 'Look at an image or sketch card from a task board (the picture is sent to you). Use ONLY when the user explicitly asks to look at, describe or analyze a picture. Get card ids from read_board.', { cardId:{ type:'string' } }, ['cardId'], async i => {
      if (!boardApi) throw new Error('Boards are not available');
      const f = await boardApi.findCard(String(i.cardId || ''));
      if (!f) throw new Error('Card not found: ' + i.cardId);
      const it = f.item;
      if (it.type !== 'image' && !(it.type === 'sketch' && it.mediaId)) throw new Error('This card is not an image (type: ' + it.type + ')');
      const img = await boardApi.imageForAI(it);
      const label = it.type === 'sketch' ? 'зарисовка' : (it.caption || it.name || 'изображение');
      log('eye', 'Отправляю ассистенту картинку: ' + label + ' (' + img.width + '×' + img.height + ', JPEG)', it.type === 'image' && it.thumb ? boardApi.thumbUrl(it.mediaId) : boardApi.mediaUrl(it.mediaId));
      return { __content:[
        { type:'image', source:{ type:'base64', media_type:img.mediaType, data:img.data } },
        { type:'text', text:'Карточка ' + it.id + ' (' + (it.type === 'sketch' ? 'зарисовка' : 'изображение') + (it.name ? ', файл «' + it.name + '»' : '') + (it.caption ? ', подпись «' + it.caption + '»' : '') + (it.overlay ? ', поверх нарисованы пометки' : '') + ')' }
      ] };
    })
  ];
}
async function aiSend(text){
  if (aiBusy || !sample) return;
  aiBusy = true; aiChips.hidden = true;
  aiSendBtn.replaceChildren(icon('stop', 16)); aiSendBtn.setAttribute('aria-label', 'Остановить');
  addMsg('user', text);
  const bot = addMsg('bot', ''); const md = bot.querySelector('.md'); md.className = 'md thinking';
  const logEl = bot.querySelector('.acts-log');
  const msgs = aiHistory.slice(-10).concat([{ role:'user', content:buildPrompt(text) }]);
  aiCtrl = new AbortController();
  try {
    const res = await sample(msgs, {
      tools:aiTools(logEl), cache:false, modelTier:'default', signal:aiCtrl.signal,
      onText:({ text:t }) => { md.className = 'md'; md.innerHTML = mdLite(t); aiMsgs.scrollTop = aiMsgs.scrollHeight; }
    });
    md.className = 'md';
    const final = (res && res.text) || '';
    md.innerHTML = mdLite(final || (logEl.children.length ? 'Готово.' : '…'));
    aiHistory.push({ role:'user', content:text }, { role:'assistant', content:final || 'Готово.' });
  } catch (e) {
    md.className = 'md';
    const code = e && e.code;
    const partial = e && e.text ? mdLite(e.text) : '';
    md.innerHTML = partial + '<p><i>' + (code === 'not_granted' ? 'Нет доступа к ИИ: разрешите его (или проверьте ключ API) и повторите.' : code === 'rate_limited' ? 'Слишком много запросов — подождите немного.' : (aiCtrl && aiCtrl.signal.aborted) ? 'Остановлено.' : 'Не удалось получить ответ. Попробуйте ещё раз.') + '</i></p>';
  } finally {
    aiBusy = false; aiCtrl = null;
    aiSendBtn.replaceChildren(icon('up', 18)); aiSendBtn.setAttribute('aria-label', 'Отправить');
    aiMsgs.scrollTop = aiMsgs.scrollHeight;
  }
}
async function initAI(){
  try { if (window.claude && window.claude.use) sample = await window.claude.use('sample'); } catch (e) { sample = null; }
  if (!sample) return;
  buildAiPanel();
  aiBtn.append(icon('spark', 15), 'Ассистент'); aiBtn.hidden = false;
  aiBtn.addEventListener('click', () => aiPanel.classList.contains('open') ? closeAi() : openAi());
}

/* ---------- task boards ---------- */
function createBoards(){
  if (!window.PlanerBoard) return null;
  const repaintTask = id => { const loc = findTask(id); if (!loc) return; const el = cols[loc.k] && cols[loc.k].list.querySelector('.item[data-id="' + id + '"]'); if (el) paintItem(el, loc.t); return el; };
  return window.PlanerBoard.create({
    h, icon, IC, toast, openMenu, closeMenu, isMenuOpen:() => !!menuEl,
    electron:window.electronAPI || null,
    store:extraStore, pending:pendingSave,
    saveError:e => { setStatus('error'); showBanner('Не удалось сохранить доску: ' + ((e && (e.code || e.message)) || 'ошибка') + '. Изменения остаются на экране.'); },
    getTask:id => { const l = findTask(id); return l ? l.t : null; },
    taskSection:id => { const l = findTask(id); return l ? l.k : null; },
    sectionTitle:k => SECTIONS[k] ? SECTIONS[k].title : '',
    setTaskText(id, text){
      const loc = findTask(id); if (!loc || loc.t.text === text) return;
      loc.t.text = String(text).slice(0, 500); touch(loc.k);
      const el = repaintTask(id), ta = el && el.querySelector('.txt');
      if (ta && document.activeElement !== ta) { ta.value = loc.t.text; autosize(ta); }
    },
    setBoardCount(id, n){ const loc = findTask(id); if (!loc || (loc.t.boardCount | 0) === n) return; loc.t.boardCount = n; touch(loc.k); repaintTask(id); },
    allBoardTaskIds:() => ['day', 'week'].flatMap(k => S[k].items.filter(t => t.boardCount > 0).map(t => t.id)),
    toggleAi:() => { if (!sample) { toast('Ассистент недоступен.'); return; } aiPanel.classList.contains('open') ? closeAi() : openAi(); },
    onClosed:id => { repaintTask(id); }
  });
}

/* ---------- global keys & boot ---------- */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (menuEl) closeMenu();
  else if (overlayEl) closeEditor();
  else if (aiPanel.classList.contains('open')) closeAi();
});
if ('ResizeObserver' in window) new ResizeObserver(debounce(autosizeAll, 80)).observe(board);
// Файл, случайно брошенный мимо доски, не должен открываться вместо приложения.
['dragover', 'drop'].forEach(t => document.addEventListener(t, e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); }));

(async function main(){
  try { boardApi = createBoards(); } catch (e) { console.error('board:', e); boardApi = null; }
  const ea = window.electronAPI;
  if (ea && ea.onFlush) ea.onFlush(flushEverything);
  if (ea && ea.onStoreError) ea.onStoreError(m => { setStatus('error'); showBanner(m); });
  buildBoard();
  KEYS.forEach(refreshSection);
  setStatus('loading');
  await initBackend();
  await loadAll();
  loaded = true;
  KEYS.forEach(refreshSection);
  board.classList.remove('loading');
  idleStatus();
  initAI();
  if (ea && ea.notices) { try { const list = await ea.notices(); if (list && list.length) showBanner(list.join(' ')); } catch (e) {} }
})();
})();
</script>
