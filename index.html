<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: media:; media-src media:; font-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Планер</title>
<style>
:root{
  --bg:#f3f1ec; --panel:#fffdfa; --panel-2:#f8f6f1; --line:#e8e4dc; --line-2:#d6d1c6;
  --text:#25221e; --muted:#6f6a63; --faint:#b5afa5; --hover:#f2efe9;
  --p1:#2f6fe0; --p2:#c97f00; --p3:#d93a40;
  --c-day:#0b8a80; --c-week:#5156d6; --c-plans:#c0602f; --c-ideas:#a145b8;
  --shadow:0 1px 2px rgba(37,34,30,.06),0 6px 18px rgba(37,34,30,.05);
  --ink:#25221e; --ink-text:#fffdfa;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#131210; --panel:#1b1916; --panel-2:#211f1b; --line:#2c2924; --line-2:#3c3831;
    --text:#ece8e0; --muted:#9a9388; --faint:#5e5950; --hover:#24221e;
    --p1:#6ea0ff; --p2:#e8a43a; --p3:#ff6b6f;
    --c-day:#36c2b6; --c-week:#8a8eff; --c-plans:#ee8f5c; --c-ideas:#cf7ee3;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
    --ink:#ece8e0; --ink-text:#1b1916;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--p1);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

#app{height:100vh;height:100dvh;min-height:560px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px 10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.logo{width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.logo i{border-radius:3px;display:block}
.logo i:nth-child(1){background:var(--c-day)}.logo i:nth-child(2){background:var(--c-week)}
.logo i:nth-child(3){background:var(--c-plans)}.logo i:nth-child(4){background:var(--c-ideas)}
.spacer{flex:1}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status[data-s=ok]::before{background:#2fa36b}
.status[data-s=busy]::before{background:var(--p2)}
.status[data-s=warn]::before{background:var(--p2)}
.status[data-s=err]::before{background:var(--p3)}
.ai-btn{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;background:var(--ink);color:var(--ink-text);font-weight:600;font-size:13px}
.ai-btn:hover{opacity:.9}
.banner{margin:0 18px 8px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--p2) 16%,var(--panel));border:1px solid color-mix(in srgb,var(--p2) 40%,transparent);font-size:13px}

.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:0 14px 14px;transition:opacity .2s}
.board.loading{opacity:.45;pointer-events:none}
.col{--accent:var(--c-day);background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow);overflow:hidden}
.col[data-key=week]{--accent:var(--c-week)}
.col[data-key=plans]{--accent:var(--c-plans)}
.col[data-key=ideas]{--accent:var(--c-ideas)}
.col::before{content:"";height:3px;background:var(--accent);flex:none}
.col-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 12px 0 16px}
.col-title{display:flex;align-items:center;gap:9px;min-width:0}
.col-title h2{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.ico{color:var(--accent);display:grid;place-items:center}
.col-tools{display:flex;gap:2px}
.tool{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.tool:hover{background:var(--hover);color:var(--text)}
.tool[aria-pressed=true]{color:var(--accent)}
.col-sub{padding:2px 16px 0;color:var(--muted);font-size:12.5px;min-height:19px}
.dows{display:flex;gap:3px;margin-top:2px}
.dows span{font-size:11px;padding:1px 6px;border-radius:6px;color:var(--muted)}
.dows span.today{background:var(--accent);color:#fff;font-weight:600}
.prog{display:flex;align-items:center;gap:10px;padding:10px 16px 6px}
.bar{flex:1;height:5px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;transition:width .3s}
.prog .n{font-size:12px;color:var(--muted);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.list{flex:1;min-height:0;overflow:auto;padding:4px 8px 8px;scrollbar-width:thin}
.empty{color:var(--muted);text-align:center;padding:28px 18px;font-size:13px}

/* task item */
.item{position:relative;display:grid;grid-template-columns:14px 22px minmax(0,1fr) auto;column-gap:6px;align-items:start;padding:6px 6px 6px 2px;border-radius:10px}
.item:hover,.item:focus-within{background:var(--hover)}
.item.dragging{opacity:.4}
.item.drop-before::after,.list.drop-end::after{content:"";position:absolute;left:8px;right:8px;top:-1px;height:2px;border-radius:2px;background:var(--accent)}
.list.drop-end{position:relative}
.list.drop-end::after{top:auto;bottom:4px}
.item[data-pri="1"]::before,.item[data-pri="2"]::before,.item[data-pri="3"]::before{content:"";position:absolute;left:-1px;top:9px;bottom:9px;width:3px;border-radius:3px}
.item[data-pri="1"]::before{background:var(--p1)}.item[data-pri="2"]::before{background:var(--p2)}.item[data-pri="3"]::before{background:var(--p3)}
.grip{height:22px;display:grid;place-items:center;color:var(--faint);cursor:grab;opacity:0}
.item:hover .grip{opacity:1}
.cb{width:20px;height:20px;margin-top:1px;border:1.6px solid var(--line-2);border-radius:6px;display:grid;place-items:center;color:transparent;background:var(--panel);transition:background .15s,border-color .15s}
.cb:hover{border-color:var(--accent)}
.cb[aria-checked=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.txt{display:block;width:100%;border:0;background:transparent;resize:none;outline:none;padding:1px 0;line-height:1.45;overflow:hidden;min-height:22px}
.item.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.acts{display:flex;align-items:center;gap:1px}
.acts>button{min-width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--muted);opacity:0;transition:opacity .12s}
.acts>button:hover{background:var(--line)}
.item:hover .acts>button,.item:focus-within .acts>button{opacity:1}
.item:not([data-pri="0"]) .acts .pri,.item.has-note .acts .note-btn{opacity:1}
.pri{font-weight:700;font-size:12px;letter-spacing:-1px;padding:0 5px}
.item[data-pri="1"] .pri{color:var(--p1);background:color-mix(in srgb,var(--p1) 14%,transparent)}
.item[data-pri="2"] .pri{color:var(--p2);background:color-mix(in srgb,var(--p2) 16%,transparent)}
.item[data-pri="3"] .pri{color:var(--p3);background:color-mix(in srgb,var(--p3) 14%,transparent)}
.item.has-note .note-btn{color:var(--accent)}
.note-wrap{grid-column:3 / -1;display:none;margin-top:1px}
.item.has-note .note-wrap,.item.note-open .note-wrap{display:block}
.note{display:none;width:100%;resize:none;outline:none;overflow:hidden;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;line-height:1.45}
.note:focus{border-color:var(--accent)}
.note-prev{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
.item.note-open .note{display:block}
.item.note-open .note-prev{display:none}

.composer{display:flex;align-items:center;gap:8px;margin:0 10px 10px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);color:var(--muted)}
.composer:focus-within{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.add-input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text)}
.add-input::placeholder{color:var(--muted)}

/* tree */
.node{display:flex;align-items:center;gap:6px;padding:5px 4px 5px calc(6px + var(--d,0) * 18px);border-radius:9px;cursor:pointer;min-height:34px}
.node:hover{background:var(--hover)}
.caret{width:18px;height:18px;display:grid;place-items:center;color:var(--muted);transition:transform .15s;flex:none}
.node.open .caret{transform:rotate(90deg)}
.n-ico{color:var(--accent);flex:none;display:grid;place-items:center}
.page .n-ico{color:var(--muted)}
.page .caret{visibility:hidden}
.n-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder .n-title{font-weight:600}
.n-title.ph{color:var(--muted)}
.n-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.n-acts{display:flex;gap:1px;flex:none}
.n-acts button{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--muted);opacity:0}
.n-acts button:hover{background:var(--line);color:var(--text)}
.node:hover .n-acts button,.node:focus-within .n-acts button{opacity:1}
.rename{flex:1;min-width:0;border:1px solid var(--accent);border-radius:6px;padding:2px 6px;background:var(--panel);outline:none}
.node-empty{color:var(--muted);font-size:12.5px;padding:4px 8px 6px calc(32px + var(--d,0) * 18px)}

/* menu */
.menu{position:fixed;z-index:100;min-width:210px;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.2);padding:5px}
.menu-it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13.5px}
.menu-it:hover{background:var(--hover)}
.menu-it svg{color:var(--muted);flex:none}
.menu-it.danger,.menu-it.danger svg{color:var(--p3)}
.menu-sep{height:1px;background:var(--line);margin:4px 2px}

/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:120;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--ink-text);padding:10px 16px;border-radius:12px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:92vw}
.toast button{font-weight:700;text-decoration:underline}

/* page editor */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,18,14,.45);display:grid;place-items:center;padding:20px}
.sheet{width:min(780px,100%);height:min(86vh,860px);background:var(--panel);border-radius:18px;border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden;--accent:var(--c-plans)}
.sheet[data-key=ideas]{--accent:var(--c-ideas)}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap}
.crumbs b{color:var(--accent);font-weight:600}
.crumbs span{overflow:hidden;text-overflow:ellipsis}
.sheet-body{flex:1;min-height:0;overflow:auto;padding:26px clamp(18px,6vw,56px) 40px}
.title-in{width:100%;border:0;outline:0;background:transparent;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:0 0 14px;padding:0}
.title-in::placeholder{color:var(--faint)}
.blk{display:grid;grid-template-columns:20px 26px minmax(0,1fr);align-items:start;border-radius:8px}
.blocks{margin-left:-20px}
.t-p,.t-h{grid-template-columns:20px minmax(0,1fr)}
.t-p .b-gap,.t-h .b-gap{display:none}
.b-menu{height:28px;display:grid;place-items:center;color:var(--faint);opacity:0;cursor:pointer}
.blk:hover .b-menu,.blk:focus-within .b-menu{opacity:1}
.b-gap{display:block}
.b-bul{height:28px;display:grid;place-items:center;font-size:18px;color:var(--muted)}
.b-cb{margin:4px 0 0 2px}
.b-in{display:block;width:100%;border:0;outline:0;background:transparent;resize:none;overflow:hidden;padding:3px 0;line-height:1.55;font-size:15.5px;min-height:28px}
.b-in::placeholder{color:transparent}
.b-in:focus::placeholder,.blk.only .b-in::placeholder{color:var(--faint)}
.t-h .b-in{font-size:20px;font-weight:650;letter-spacing:-.01em;padding-top:10px}
.t-h .b-menu{height:40px}
.blk.done .b-in{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.pad{height:120px;cursor:text}
.sheet-foot{display:flex;justify-content:space-between;gap:12px;padding:9px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);flex-wrap:wrap}
kbd{font:inherit;font-size:11.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:0 5px}

/* ai panel */
.ai{position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);z-index:70;background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.18);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease;visibility:hidden}
.ai.open{transform:none;visibility:visible}
.ai-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 12px 18px;border-bottom:1px solid var(--line)}
.ai-head h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.ai-msgs{flex:1;min-height:0;overflow:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;line-height:1.5;font-size:14px}
.msg.user{align-self:flex-end;background:var(--ink);color:var(--ink-text);padding:8px 13px;border-radius:14px 14px 4px 14px;white-space:pre-wrap}
.msg.bot{align-self:flex-start}
.msg.bot p{margin:0 0 8px}.msg.bot ul{margin:0 0 8px;padding-left:20px}.msg.bot li{margin:2px 0}
.msg.bot code{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:0 4px;font-size:12.5px}
.msg .acts-log{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.act{font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:flex-start;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:5px 9px}
.act svg{color:var(--c-day);flex:none;margin-top:2px}
.thinking{color:var(--muted)}
.thinking::after{content:"…";animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.2}}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 8px}
.chip{font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line-2);color:var(--text);background:var(--panel-2)}
.chip:hover{background:var(--hover)}
.ai-form{display:flex;align-items:flex-end;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--line)}
.ai-in{flex:1;resize:none;max-height:140px;min-height:40px;border:1px solid var(--line-2);border-radius:12px;padding:9px 12px;background:var(--panel-2);outline:none;line-height:1.4}
.ai-in:focus{border-color:var(--ink)}
.send{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--ink-text);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.4}

/* week: month calendar */
.flip svg{transform:rotate(180deg)}
.mc-wrap{padding:8px 12px 0}
.mc{user-select:none}
.mc-head{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 0 4px}
.mc-title{font-size:13px;font-weight:650;letter-spacing:-.01em}
.mc-nav{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--muted);flex:none}
.mc-nav:hover{background:var(--hover);color:var(--text)}
.mc-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px 2px}
.mc-dow{font-size:10.5px;font-weight:600;color:var(--muted);text-align:center;padding:2px 0 3px}
.mc-day{position:relative;height:29px;border-radius:8px;display:grid;place-items:center;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--text)}
.mc-day:hover{background:var(--hover)}
.mc-day.we{color:var(--muted)}
.mc-day.out{color:var(--faint)}
.mc-day.inweek{background:color-mix(in srgb,var(--accent) 11%,transparent)}
.mc-day.inweek:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.mc-n{min-width:22px;height:22px;display:grid;place-items:center;border-radius:999px;line-height:1}
.mc-day.today .mc-n{background:var(--accent);color:#fff;font-weight:700}
.mc-day.picked .mc-n{box-shadow:0 0 0 1.5px var(--accent);font-weight:700}
.mc-dot{position:absolute;left:50%;bottom:1px;width:4px;height:4px;margin-left:-2px;border-radius:50%}
.mc-day.has .mc-dot{background:var(--faint)}
.mc-day.urgent .mc-dot{background:var(--p3)}
.mc-day.drop-on{box-shadow:inset 0 0 0 2px var(--accent)}
.date-pop{--accent:var(--c-week);width:264px;padding:10px 10px 8px}
/* week: days of the selected week */
.wk-nav{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 4px 6px;font-size:12.5px}
.wk-range{font-weight:650}
.wk-this{color:var(--muted);font-weight:500}
.wk-day{position:relative;border-radius:10px;margin-bottom:2px}
.wk-day.today{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.wk-day.drop-on{box-shadow:inset 0 0 0 2px var(--accent)}
.wk-head{display:flex;align-items:center;gap:7px;width:100%;min-height:34px;padding:5px 8px;border-radius:9px;text-align:left}
.wk-head:hover{background:var(--hover)}
.wk-head svg{color:var(--faint);flex:none}
.wk-dow{font-weight:700;font-size:12px;color:var(--accent);min-width:20px}
.wk-num{font-size:13px;font-weight:600;white-space:nowrap}
.wk-rel{font-size:11px;font-weight:650;padding:1px 7px;border-radius:999px;background:var(--accent);color:#fff;white-space:nowrap}
.wk-cnt{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wk-day.past .wk-dow,.wk-day.past .wk-num{opacity:.55}
.wk-day.undated .wk-num{color:var(--muted)}
.wk-tasks{padding:0 6px 6px 10px}
.wk-task{display:flex;align-items:flex-start;gap:8px;padding:3px 5px;border-radius:7px;cursor:pointer;font-size:13.5px;line-height:1.4}
.wk-task:hover{background:var(--hover)}
.wk-task.dragging{opacity:.4}
.wk-task .cb{width:17px;height:17px;border-radius:5px;margin-top:1px;flex:none}
.wk-t{min-width:0;overflow-wrap:anywhere}
.wk-task{position:relative}
.wk-task[data-pri="3"]::before,.wk.all .wk-task[data-pri="1"]::before,.wk.all .wk-task[data-pri="2"]::before{content:"";position:absolute;left:-3px;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--p3)}
.wk.all .wk-task[data-pri="1"]::before{background:var(--p1)}
.wk.all .wk-task[data-pri="2"]::before{background:var(--p2)}
.wk-task.done .wk-t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.wk-hint{color:var(--muted);font-size:12.5px;line-height:1.5;padding:12px 14px;text-align:center}
/* today: unfinished tasks from previous days */
.overdue{margin:12px 4px 4px;border:1px dashed var(--line-2);border-radius:11px;padding:2px}
.od-head{display:flex;align-items:center;gap:7px;width:100%;padding:7px 9px;font-size:12.5px;color:var(--muted);border-radius:9px;text-align:left}
.od-head:hover{background:var(--hover);color:var(--text)}
.od-head svg{transition:transform .15s;flex:none}
.overdue.open .od-head svg{transform:rotate(90deg)}
.od-head b{margin-left:auto;background:color-mix(in srgb,var(--p2) 18%,transparent);color:var(--p2);padding:0 8px;border-radius:999px;font-size:11.5px}

function dayItems(k, create){
  if (k == null) return S.cal.undated;
  let d = S.cal.days[k];
  if (!d) { if (!create) return []; d = S.cal.days[k] = { items:[] }; }
  return d.items;
}
function pruneDays(){
  for (const k of Object.keys(S.cal.days)) {
    const d = S.cal.days[k];
    if (d.blocks && !d.blocks.length) delete d.blocks;
    if (!d.items.length && !d.blocks) delete S.cal.days[k];
  }
}
const dayBlocks = k => (k && S.cal.days[k] && S.cal.days[k].blocks) || [];
function findTask(id){
  for (const [k, d] of Object.entries(S.cal.days)) { const i = d.items.findIndex(t => t.id === id); if (i >= 0) return { date:k, arr:d.items, i, t:d.items[i] }; }
  const i = S.cal.undated.findIndex(t => t.id === id);
  return i >= 0 ? { date:null, arr:S.cal.undated, i, t:S.cal.undated[i] } : null;
}
function findNode(k, id, arr = S[k].nodes, path = []){
  for (let i = 0; i < arr.length; i++) {
    const n = arr[i];
    if (n.id === id) return { k, node:n, arr, index:i, path };
    if (n.type === 'folder') { const r = findNode(k, id, n.children, [...path, n]); if (r) return r; }
  }
  return null;
}
const findAnyNode = id => findNode('plans', id) || findNode('ideas', id);
function countNodes(nodes){ let n = 0; nodes.forEach(x => { if (x.type === 'page') n++; else n += countNodes(x.children); }); return n; }

/* ---------- persistence ---------- */
const backend = { kind:'memory', db:null, uid:null, refs:{} };
let boardApi = null;   // доска задачи (src/board.js), создаётся перед запуском
const timers = {}, writing = {}, again = {}, lastSaved = {}, pendingRemote = {};
const dirty = new Set();
let loaded = false;

const statusEl = $('#status');
function setStatus(kind){
  const map = {
    loading:['Загрузка…', 'busy'], saving:['Сохраняю…', 'busy'], saved:['Сохранено', 'ok'],
    local:['Сохранено в этом браузере', 'warn'], memory:['Не сохраняется', 'err'], error:['Ошибка сохранения', 'err']
  };
  const [txt, s] = map[kind]; statusEl.textContent = txt; statusEl.dataset.s = s;
}
const idleStatus = () => setStatus(backend.kind === 'db' ? 'saved' : backend.kind === 'local' ? 'local' : 'memory');
function showBanner(msg){ const b = $('#banner'); b.textContent = msg; b.hidden = !msg; }

async function initBackend(){
  let db = null, uid = null;
  try {
    if (window.claude && window.claude.use) {
      db = await window.claude.use('db');
      const user = await window.claude.use('user');
      uid = user ? await user.id() : null;
    }
  } catch (e) { db = null; }
  if (db && uid) { backend.kind = 'db'; backend.db = db; backend.uid = uid; return; }
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); backend.kind = 'local'; }
  catch (e) { backend.kind = 'memory'; }
}
function loadAll(){
  return new Promise(resolve => {
    if (backend.kind === 'db') {
      const col = backend.db.collection('data/users/' + backend.uid);
      let pending = KEYS.length, finished = false;
      const finish = () => { if (!finished) { finished = true; clearTimeout(tm); resolve(); } };
      const tm = setTimeout(() => { showBanner('Хранилище отвечает медленно — данные могут быть неактуальными. Не закрывайте страницу.'); finish(); }, 10000);
      KEYS.forEach(k => {
        let first = true;
        const ref = col.doc('planner-' + k);
        backend.refs[k] = ref;
        ref.onSnapshot(snap => {
          onRemote(k, snap);
          if (first && !snap.metadata.fromCache) { first = false; if (--pending === 0) finish(); }
        }, err => {
          showBanner('Не удалось загрузить данные (' + (err && err.code) + ').');
          if (first) { first = false; if (--pending === 0) finish(); }
        });
      });
    } else {
      KEYS.forEach(k => {
        try { const raw = localStorage.getItem('planner1-' + k); if (raw) { S[k] = normalize(k, JSON.parse(raw)); if (k === 'cal') calSeen = true; } } catch (e) {}
      });
      resolve();
    }
  });
}
function onRemote(k, snap){
  if (!snap.exists) return;
  const d = snap.data();
  if (snap.metadata.hasPendingWrites || dirty.has(k) || writing[k]) return;
  if (stable(d) === lastSaved[k]) return;
  if (loaded && isTyping()) { pendingRemote[k] = d; return; }
  applyRemote(k, d);
}
function applyRemote(k, d){
  S[k] = normalize(k, clone(d));
  lastSaved[k] = stable(d);
  if (k === 'cal') calSeen = true;
  if (loaded) { refreshSection(k); if (editing && editing.k === k) editorSync(); }
}

/* Переход со старого формата: «Сегодня» и «Неделя» были двумя списками без дат.
   Задачи «Сегодня» → на сегодняшнюю дату, задачи «Недели» → «Без даты». Доски, которые были у задач,
   становятся страницами в «Основных планах» (папка «Доски задач»). Старые документы не удаляются. */
let calSeen = false;
async function legacyGet(k){
  try {
    if (backend.kind === 'db') { const s = await backend.db.collection('data/users/' + backend.uid).doc('planner-' + k).get(); return s.exists ? s.data() : null; }
    if (backend.kind === 'local') { const r = localStorage.getItem('planner1-' + k); return r ? JSON.parse(r) : null; }
  } catch (e) {}
  return null;
}
async function migrateLegacy(){
  const day = await legacyGet('day'), week = await legacyGet('week');
  const dItems = day && Array.isArray(day.items) ? day.items : [], wItems = week && Array.isArray(week.items) ? week.items : [];
  calSeen = true;
  if (!dItems.length && !wItems.length) return;
  const today = todayKey(), boards = [];
  dItems.forEach(t => { dayItems(today, true).push(normTask(t)); if (t.boardCount > 0) boards.push(t); });
  wItems.forEach(t => { S.cal.undated.push(normTask(t)); if (t.boardCount > 0) boards.push(t); });
  if (day && day.hideDone) S.cal.hideDone = true;
  if (boards.length) {
    let f = S.plans.nodes.find(n => n.type === 'folder' && n.title === 'Доски задач');
    if (!f) { f = { id:newId(), type:'folder', title:'Доски задач', open:true, children:[] }; S.plans.nodes.push(f); }
    boards.forEach(t => f.children.push({ id:newId(), type:'page', kind:'board', title:String(t.text || 'Без названия'), blocks:[newBlock('p', String(t.note || ''))], boardId:String(t.id), boardCount:t.boardCount | 0 }));
    touch('plans');
  }
  touch('cal');
}
const isTyping = () => { const a = document.activeElement; return !!(a && a.matches && a.matches('textarea,input')); };
document.addEventListener('focusout', () => setTimeout(() => {
  if (isTyping()) return;
  for (const k of Object.keys(pendingRemote)) { const d = pendingRemote[k]; delete pendingRemote[k]; if (!dirty.has(k)) applyRemote(k, d); }
}, 60));

function touch(k){
  dirty.add(k); setStatus('saving');
  clearTimeout(timers[k]); timers[k] = setTimeout(() => flush(k), 500);
}
async function flush(k){
  if (!dirty.has(k)) return;
  if (writing[k]) { again[k] = true; return; }
  writing[k] = true; dirty.delete(k);
  try {
    const body = clone(S[k]);
    const json = JSON.stringify(body);
    lastSaved[k] = stable(body);
    if (backend.kind === 'db') {
      if (!window.electronAPI && new Blob([json]).size > 235000) toast('Этот раздел почти достиг лимита размера (256 КБ). Удалите лишнее или разнесите по другим разделам.');
      await backend.refs[k].set(body);
    } else if (backend.kind === 'local') {
      localStorage.setItem('planner1-' + k, json);
    }
    showBanner('');
  } catch (e) {
    setStatus('error');
    showBanner('Не удалось сохранить: ' + ((e && (e.code || e.message)) || 'ошибка') + '. Изменения остаются на экране; попробуйте ещё раз после следующей правки.');
    writing[k] = false; return;
  }
  writing[k] = false;
  if (again[k] || dirty.has(k)) { again[k] = false; clearTimeout(timers[k]); timers[k] = setTimeout(() => flush(k), 300); }
  else if (!dirty.size && !Object.values(writing).some(Boolean) && !extraPending.size) idleStatus();
}
function flushAll(){ KEYS.forEach(k => { if (dirty.has(k)) { clearTimeout(timers[k]); flush(k); } }); }
// Дописать всё несохранённое (перед закрытием окна): разделы и доски.
async function flushEverything(){
  if (boardApi) { try { await boardApi.flush(); } catch (e) {} }
  flushAll();
  for (let i = 0; i < 100 && (dirty.size || Object.values(writing).some(Boolean)); i++) { await new Promise(r => setTimeout(r, 20)); flushAll(); }
}

/* Отдельные документы (доски задач): тот же бэкенд, что и у разделов */
const extraPending = new Set(), memDocs = {};
const extraStore = {
  async get(name){
    if (backend.kind === 'db') { const s = await backend.db.collection('data/users/' + backend.uid).doc(name).get(); return s.exists ? s.data() : null; }
    if (backend.kind === 'local') { try { const r = localStorage.getItem('planner1-' + name); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
    return memDocs[name] ? clone(memDocs[name]) : null;
  },
  async set(name, v){
    if (backend.kind === 'db') return backend.db.collection('data/users/' + backend.uid).doc(name).set(v);
    if (backend.kind === 'local') { localStorage.setItem('planner1-' + name, JSON.stringify(v)); return; }
    memDocs[name] = clone(v);
  }
};
function pendingSave(key, on){
  if (on) { extraPending.add(key); setStatus('saving'); return; }
  extraPending.delete(key);
  if (!extraPending.size && !dirty.size && !Object.values(writing).some(Boolean)) idleStatus();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) flushAll(); else refreshDates(); });
window.addEventListener('pagehide', flushAll);

/* ---------- toast & menu ---------- */
let toastEl = null, toastTimer = null;
function toast(msg, undo){
  if (toastEl) toastEl.remove(); clearTimeout(toastTimer);
  toastEl = h('div', { class:'toast', role:'status' }, h('span', {}, msg),
    undo ? h('button', { type:'button', onclick:() => { undo(); toastEl && toastEl.remove(); toastEl = null; } }, 'Отменить') : null);
  document.body.append(toastEl);
  toastTimer = setTimeout(() => { toastEl && toastEl.remove(); toastEl = null; }, undo ? 7000 : 3500);
}
function undoer(keys){
  const snap = keys.map(k => [k, JSON.stringify(S[k])]);
  return () => { snap.forEach(([k, j]) => { S[k] = JSON.parse(j); touch(k); refreshSection(k); }); if (editing && !findNode(editing.k, editing.id)) closeEditor(); };
}

let menuEl = null;
function closeMenu(){ if (menuEl) { menuEl.remove(); menuEl = null; document.removeEventListener('pointerdown', menuOutside, true); } }
function menuOutside(e){ if (menuEl && !menuEl.contains(e.target)) closeMenu(); }
function openMenu(anchor, items){
  closeMenu();
  menuEl = h('div', { class:'menu', role:'menu' }, items.filter(Boolean).map(it => it.sep
    ? h('div', { class:'menu-sep' })
    : it.swatches
    ? h('div', { class:'bd-sw menu-sw', role:'radiogroup', 'aria-label':'Цвет' }, it.swatches.map(c => h('button', { class:'bd-sw-b', type:'button', role:'radio', 'data-color':c, 'aria-checked':String(it.value === c), 'aria-label':it.names[c], title:it.names[c], onclick:() => { closeMenu(); it.pick(c); } })))
    : h('button', { class:'menu-it' + (it.danger ? ' danger' : ''), type:'button', role:'menuitem', onclick:() => { closeMenu(); it.run(); } }, icon(it.icon || 'dot', 15), it.label)));
  placePopup(anchor, menuEl);
}
function placePopup(anchor, el){
  document.body.append(el);
  const r = anchor.getBoundingClientRect(), mw = el.offsetWidth, mh = el.offsetHeight;
  const x = Math.min(Math.max(8, r.right - mw), innerWidth - mw - 8);
  let y = r.bottom + 4; if (y + mh > innerHeight - 8) y = Math.max(8, r.top - mh - 4);
  el.style.left = x + 'px'; el.style.top = y + 'px';
  setTimeout(() => document.addEventListener('pointerdown', menuOutside, true), 0);
}

/* ---------- задачи: общий код списков («Сегодня» и окно дня) ---------- */
const openNotes = new Set();
const firstLine = s => (s || '').split('\n').find(l => l.trim()) || '';
const forRows = (id, fn) => document.querySelectorAll('.item[data-id="' + id + '"]').forEach(fn);
const refreshWeekSoon = debounce(() => refreshWeek(), 250);

function bindTaskList(list){
  list.addEventListener('click', e => {
    const sec = e.target.closest('.tblock');
    if (sec && e.target.closest('.tb-add')) { openBlockComposer(sec); return; }
    if (sec && e.target.closest('.tb-more')) { blockMenu(e.target.closest('.tb-more'), sec); return; }
    const el = e.target.closest('.item'); if (!el) return;
    const loc = findTask(el.dataset.id); if (!loc) return; const t = loc.t;
    if (e.target.closest('.cb')) {
      t.done = !t.done; forRows(t.id, r => paintItem(r, t)); touch('cal'); updateProgress(); paintDayProgress(); paintBlockCounts(); refreshWeek();
      if (t.done && S.cal.hideDone && list === cols.day.list) setTimeout(() => { if (el.isConnected && t.done) refreshToday(); }, 450);
    } else if (e.target.closest('.pri')) {
      t.pri = (t.pri + 1) % 4; forRows(t.id, r => paintItem(r, t)); touch('cal'); refreshWeek();
    } else if (e.target.closest('.note-btn') || e.target.closest('.note-prev')) {
      if (openNotes.has(t.id)) openNotes.delete(t.id); else openNotes.add(t.id);
      paintItem(el, t);
      if (openNotes.has(t.id)) { const ta = el.querySelector('.note'); autosize(ta); ta.focus(); }
    } else if (e.target.closest('.more')) taskMenu(e.target.closest('.more'), t);
  });
  list.addEventListener('input', e => {
    const el = e.target.closest('.item'); if (!el) return;
    const loc = findTask(el.dataset.id); if (!loc) return; const t = loc.t;
    if (e.target.matches('.txt')) {
      t.text = e.target.value; autosize(e.target);
      forRows(t.id, r => { const x = r.querySelector('.txt'); if (x !== e.target) { x.value = t.text; autosize(x); } });
      refreshWeekSoon();
    } else if (e.target.matches('.note')) { t.note = e.target.value; autosize(e.target); paintItem(el, t); }
    else return;
    touch('cal');
  });
  list.addEventListener('focusin', e => { if (e.target.matches('.txt')) e.target.dataset.prev = e.target.value; });
  list.addEventListener('focusout', e => {
    const el = e.target.closest('.item'); if (!el) return;
    if (e.target.matches('.txt') && !e.target.value.trim() && e.target.dataset.prev) {
      e.target.value = e.target.dataset.prev; const loc = findTask(el.dataset.id); if (loc) { loc.t.text = e.target.value; touch('cal'); } autosize(e.target);
    }
    if (e.target.matches('.note')) { const loc = findTask(el.dataset.id); if (loc && !loc.t.note.trim()) { openNotes.delete(loc.t.id); paintItem(el, loc.t); } }
  });
  list.addEventListener('keydown', e => {
    if (e.target.matches('.txt') && (e.key === 'Enter' || e.key === 'Escape') && !e.isComposing) { e.preventDefault(); e.stopPropagation(); e.target.blur(); }
    if (e.target.matches('.note') && e.key === 'Escape') { e.stopPropagation(); e.target.blur(); }
  });
}
function taskMenu(anchor, t){
  const loc = findTask(t.id); if (!loc) return;
  const today = todayKey(), tom = addDays(today, 1);
  const blocks = loc.date ? sortedBlocks(loc.date) : [];
  openMenu(anchor, [
    loc.date !== today ? { icon:'sun', label:'Перенести на сегодня', run:() => moveTask(t.id, today) } : null,
    loc.date !== tom ? { icon:'arrow', label:'Перенести на завтра', run:() => moveTask(t.id, tom) } : null,

    loc.date != null ? { icon:'x', label:'Убрать дату', run:() => moveTask(t.id, null) } : null,
    blocks.length ? { sep:true } : null,

    t.block ? { icon:'x', label:'Убрать из блока', run:() => setTaskBlock(t.id, null) } : null,
    { sep:true },
    { icon:'trash', danger:true, label:'Удалить', run:() => deleteTask(t.id) }

}

function itemEl(t){
  const el = h('div', { class:'item', 'data-id':t.id },
    h('button', { class:'grip', type:'button', tabindex:'-1', 'aria-hidden':'true', title:'Перетащить' }, icon('grip', 14)),
    h('button', { class:'cb', type:'button', role:'checkbox', 'aria-label':'Выполнено' }, icon('check', 14)),

function paintItem(el, t){
  el.classList.toggle('done', t.done);
  el.dataset.pri = t.pri;
  el.querySelector('.cb').setAttribute('aria-checked', String(t.done));
  const pri = el.querySelector('.pri');
  pri.replaceChildren(t.pri ? document.createTextNode('!'.repeat(t.pri)) : icon('flag', 14));
  const lab = 'Приоритет: ' + PRI[t.pri] + ' — нажмите, чтобы сменить';
  pri.title = lab; pri.setAttribute('aria-label', lab);
  el.classList.toggle('note-open', openNotes.has(t.id));
  el.classList.toggle('has-note', !!(t.note && t.note.trim()));

function parseNewTask(raw){
  let text = String(raw || '').trim(), pri = 0;
  const m = text.match(/\s*(!{1,3})$/);
  if (m && text.length > m[0].length) { pri = m[1].length; text = text.slice(0, text.length - m[0].length).trim(); }
  return { text, pri };
}
function addTask(date, input, list, block){
  const { text, pri } = parseNewTask(input.value); if (!text) return;
  const t = { id:newId(), text, done:false, pri, note:'' };
  if (block && dayBlocks(date).some(b => b.id === block)) t.block = block;
  dayItems(date, true).push(t);
  input.value = ''; touch('cal'); refreshCal();
  if (block && list) { const sec = list.querySelector('.tblock[data-block="' + block + '"]'); if (sec) openBlockComposer(sec); }
  else if (list) list.scrollTop = list.scrollHeight;
}
function sortByPriority(date){
  const arr = dayItems(date); if (!arr.length) return;
  const undo = undoer(['cal']);
  const sorted = arr.map((t, i) => ({ t, i })).sort((a, b) => (a.t.done - b.t.done) || (b.t.pri - a.t.pri) || (a.i - b.i)).map(x => x.t);
  arr.splice(0, arr.length, ...sorted);
  touch('cal'); refreshCal(); toast('Отсортировано: сначала срочные', undo);
}
function clearDone(date){
  const arr = dayItems(date), n = arr.filter(t => t.done).length;
  if (!n) { toast('Выполненных задач нет'); return; }
  const undo = undoer(['cal']);
  for (let i = arr.length - 1; i >= 0; i--) if (arr[i].done) arr.splice(i, 1);
  pruneDays(); touch('cal'); refreshCal(); toast('Удалено выполненных: ' + n, undo);
}
function deleteTask(id){
  const loc = findTask(id); if (!loc) return;
  const undo = undoer(['cal']);
  loc.arr.splice(loc.i, 1); openNotes.delete(id); pruneDays(); touch('cal'); refreshCal(); toast('Задача удалена', undo);
}
// Перенос задачи: другой день (null — «Без даты»), место в списке (перед beforeId) и блок времени.
// block: id блока, null — без блока, undefined — оставить как есть в пределах того же дня.
function moveTask(id, date, beforeId, block){
  const loc = findTask(id); if (!loc) return;
  if (date !== null && date !== undefined && !DATE_RE.test(date)) return;
  date = date === undefined ? null : date;
  if (beforeId === id) beforeId = null;
  const undo = undoer(['cal']);
  const [t] = loc.arr.splice(loc.i, 1);
  if (block !== undefined) { if (block && dayBlocks(date).some(b => b.id === block)) t.block = block; else delete t.block; }
  else if (date !== loc.date) delete t.block;                  // блоки у каждого дня свои
  const dest = dayItems(date, true);

const addHours = (hm, n) => { const [hh, mm] = hm.split(':').map(Number); const v = Math.min(23 * 60 + 59, hh * 60 + mm + n * 60); return pad2(Math.floor(v / 60)) + ':' + pad2(v % 60); };

/* ---------- перетаскивание задач мышью: порядок, блоки, дни недели, числа календаря ---------- */
let tdrag = null, justDragged = false;
const zoneTarget = z => ({ date:z.dataset.date || null, block:z.dataset.block === '*' ? undefined : (z.dataset.block || null) });
function clearDropMarks(){ document.querySelectorAll('.drop-before,.drop-after,.drop-end,.drop-on').forEach(x => x.classList.remove('drop-before', 'drop-after', 'drop-end', 'drop-on')); }
document.addEventListener('click', e => { if (justDragged) { e.preventDefault(); e.stopPropagation(); } }, true);
document.addEventListener('pointerdown', e => {
  if (e.button !== 0 || tdrag) return;
  const row = e.target.closest && e.target.closest('.item[data-id], .wk-task[data-id]');
  if (!row || !row.isConnected) return;
  const onGrip = !!e.target.closest('.grip');
  if (e.pointerType === 'touch' && !onGrip) return;                       // на сенсорном экране — только за ручку
  if (!onGrip && e.target.closest('button, input, a, .note-wrap')) return; // кнопки работают как обычно
  const ta = e.target.closest('textarea');
  if (ta && document.activeElement === ta) return;                         // в режиме ввода текста — выделение, а не перенос
  if (onGrip) e.preventDefault();
  const sx = e.clientX, sy = e.clientY, pid = e.pointerId;
  const move = ev => {
    if (ev.pointerId !== pid) return;
    if (!tdrag) { if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return; startTaskDrag(row, sx, sy); }
    ev.preventDefault();

  const stop = cancel => {

  window.addEventListener('pointercancel', cancelUp, true); document.addEventListener('keydown', key, true);

function startTaskDrag(row, sx, sy){

  try { window.getSelection().removeAllRanges(); } catch (e) {}

  const ghost = row.cloneNode(true);
  const srcTa = row.querySelectorAll('textarea');
  ghost.querySelectorAll('textarea').forEach((x, i) => { x.value = srcTa[i] ? srcTa[i].value : ''; });
  ghost.classList.add('task-ghost'); ghost.classList.remove('drop-before', 'drop-after');
  ghost.style.width = r.width + 'px';

  ghost.setAttribute('aria-hidden', 'true');
  document.body.append(ghost);

  row.classList.add('drag-src'); document.body.classList.add('task-dragging');

}
function dragOverTask(x, y){
  const d = tdrag; if (!d) return;
  d.x = x; d.y = y;
  d.ghost.style.transform = 'translate(' + (x - d.dx) + 'px,' + (y - d.dy) + 'px) rotate(1deg)';
  clearDropMarks(); d.target = null;
  const el = document.elementFromPoint(x, y); if (!el) return;
  const list = el.closest('.list');
  d.scroll = null;
  if (list) { const lr = list.getBoundingClientRect(); if (y < lr.top + 36) d.scroll = { list, dir:-1 }; else if (y > lr.bottom - 36) d.scroll = { list, dir:1 }; }
  const it = el.closest('.item[data-id], .wk-task[data-id]');
  if (it && it !== d.row && it.closest('.tz') && !it.closest('.task-ghost')) {
    const zone = it.closest('.tz'), r = it.getBoundingClientRect(), after = y > r.top + r.height / 2;
    let before = it.dataset.id;
    if (after) { let n = it.nextElementSibling; while (n && (!n.dataset.id || n === d.row)) n = n.nextElementSibling; before = n ? n.dataset.id : null; }
    it.classList.add(after ? 'drop-after' : 'drop-before');
    d.target = Object.assign(zoneTarget(zone), { beforeId:before });
    return;
  }
  if (it === d.row) return;                                                // над собой — без изменений
  let zone = el.closest('.tz') || (el.closest('.tblock') && el.closest('.tblock').querySelector('.tz'));
  if (!zone && list && list.querySelector('.tz') && !el.closest('.wk-day')) { const zs = list.querySelectorAll('.tz'); zone = zs[zs.length - 1]; }
  if (zone) { zone.classList.add('drop-end'); d.target = Object.assign(zoneTarget(zone), { beforeId:null }); return; }

}

  const boardPage = id => {
    if (!boardApi) throw new Error('Boards are not available');
    const l = findAnyNode(String(id || ''));
    if (!l || l.node.type !== 'page') throw new Error('Page not found: ' + id + ' (boards belong to pages in "plans" and "ideas")');
    return l.node;
  };
  const taskOrThrow = id => { const loc = findTask(String(id || '')); if (!loc) throw new Error('Task not found: ' + id); return loc; };
  const blockOrThrow = (date, id) => { const b = dayBlocks(date).find(x => x.id === String(id)); if (!b) throw new Error('Time block ' + id + ' not found on ' + date); return b; };
  const dateArg = v => {
    const s = String(v == null ? 'today' : v).trim().toLowerCase();
    if (!s || s === 'today' || s === 'сегодня') return todayKey();
    if (s === 'tomorrow' || s === 'завтра') return addDays(todayKey(), 1);
    if (s === 'none' || s === 'undated' || s === 'null') return null;
    if (DATE_RE.test(s) && !isNaN(parseKey(s)) && dkey(parseKey(s)) === s) return s;
    throw new Error('date must be YYYY-MM-DD, "today", "tomorrow" or "none"');
  };
  const T = (name, description, properties, required, fn) => ({ name, description, inputSchema:{ type:'object', properties, required }, execute: async i => fn(i || {}) });
  const DATE = { type:'string', description:'YYYY-MM-DD, "today", "tomorrow" or "none" (no date)' };
  return [
    T('add_task', 'Add a task to a calendar day. Priority 3 means urgent: urgent tasks are shown in the week overview. Optional block = id of a time block of that day.', { date:DATE, text:{ type:'string' }, priority:{ type:'integer', minimum:0, maximum:3 }, note:{ type:'string' }, block:{ type:'string' } }, ['text'], i => {
      const date = dateArg(i.date), text = String(i.text || '').trim(); if (!text) throw new Error('text is empty');
      const t = { id:newId(), text:text.slice(0, 500), done:false, pri:Math.min(3, Math.max(0, i.priority | 0)), note:String(i.note || '').slice(0, 1000) };
      const b = i.block ? blockOrThrow(date, i.block) : null; if (b) t.block = b.id;
      dayItems(date, true).push(t); touch('cal'); refreshCal(); log('plus', 'Добавлено на ' + dayLabel(date) + (b ? ' в блок ' + blockLabel(b) : '') + ': ' + t.text); return { ok:true, id:t.id, date };
    }),
    T('add_time_block', 'Create a time block for a day (e.g. 10:00-12:00 "Работа"). Times are 24h HH:MM, to must be later than from. Colors: blue, green, yellow, orange, pink, purple. Only when the user asks for blocks.', { date:DATE, from:{ type:'string' }, to:{ type:'string' }, title:{ type:'string' }, color:{ type:'string', enum:BLOCK_COLOR_IDS } }, ['date', 'from', 'to'], i => {
      const date = dateArg(i.date); if (!date) throw new Error('time blocks need a date');
      const b = normTimeBlock({ id:newId(), from:String(i.from || '').padStart(5, '0'), to:String(i.to || '').padStart(5, '0'), title:i.title, color:i.color || suggestBlock(date).color });
      if (!b) throw new Error('from/to must be HH:MM and to must be later than from');
      const day = S.cal.days[date] || (S.cal.days[date] = { items:[] }); day.blocks = (day.blocks || []).concat([b]);
      touch('cal'); refreshCal(); log('clock', 'Блок ' + blockLabel(b) + ' на ' + dayLabel(date)); return { ok:true, id:b.id, date };
    }),
    T('update_task', 'Change a task: text, priority 0-3 (3 = urgent), note, done flag.', { id:{ type:'string' }, text:{ type:'string' }, priority:{ type:'integer', minimum:0, maximum:3 }, note:{ type:'string' }, done:{ type:'boolean' } }, ['id'], i => {
      const t = taskOrThrow(i.id).t;
      if (typeof i.text === 'string' && i.text.trim()) t.text = i.text.trim().slice(0, 500);
      if (i.priority != null) t.pri = Math.min(3, Math.max(0, i.priority | 0));
      if (typeof i.note === 'string') t.note = i.note.slice(0, 1000);
      if (typeof i.done === 'boolean') t.done = i.done;
      touch('cal'); refreshCal(); log('check', 'Обновлено: ' + t.text); return { ok:true };
    }),
    T('move_task', 'Move a task to another day (or "none" to remove the date). Optional block: id of a time block of the target day, or "none" to take the task out of its block.', { id:{ type:'string' }, date:DATE, block:{ type:'string' } }, ['id', 'date'], i => {
      const loc = taskOrThrow(i.id), date = dateArg(i.date), t = loc.t;
      const b = i.block && i.block !== 'none' ? blockOrThrow(date, i.block) : null;
      if (loc.date !== date) { loc.arr.splice(loc.i, 1); delete t.block; dayItems(date, true).push(t); pruneDays(); }
      if (b) t.block = b.id; else if (i.block === 'none') delete t.block;
      touch('cal'); refreshCal(); log('arrow', 'Перенесено на ' + dayLabel(date) + (b ? ' в блок ' + blockLabel(b) : '') + ': ' + t.text);
      return { ok:true, date };
    }),
    T('delete_task', 'Delete a task. Only when the user explicitly asks.', { id:{ type:'string' } }, ['id'], i => {
      const loc = taskOrThrow(i.id); loc.arr.splice(loc.i, 1); pruneDays(); touch('cal'); refreshCal(); log('trash', 'Удалено: ' + loc.t.text); return { ok:true };
    }),
    T('read_page', 'Read the full content of a page from "plans" or "ideas" by id.', { id:{ type:'string' } }, ['id'], i => {
      const l = findAnyNode(i.id); if (!l || l.node.type !== 'page') throw new Error('Page not found: ' + i.id);
      return { title:l.node.title, blocks:l.node.blocks.map(b => ({ type:b.t, text:b.text, done:b.done })) };
    }),
    T('create_page', 'Create a page in "plans" or "ideas". folder is a top-level folder title (created if missing). Block types: p, h, todo, ul.', { section:{ type:'string', enum:['plans', 'ideas'] }, folder:{ type:'string' }, title:{ type:'string' }, blocks:{ type:'array', items:{ type:'object', properties:{ type:{ type:'string', enum:BLOCK_TYPES }, text:{ type:'string' }, done:{ type:'boolean' } }, required:['text'] } } }, ['section', 'title'], i => {
      const k = i.section; if (k !== 'plans' && k !== 'ideas') throw new Error('section must be plans or ideas');
      let arr = S[k].nodes;
      if (i.folder && String(i.folder).trim()) {
        const nm = String(i.folder).trim().toLowerCase();
        let f = S[k].nodes.find(n => n.type === 'folder' && n.title.trim().toLowerCase() === nm);
        if (!f) { f = { id:newId(), type:'folder', title:String(i.folder).trim().slice(0, 120), open:true, children:[] }; S[k].nodes.push(f); }
        f.open = true; arr = f.children;
      }
      const page = { id:newId(), type:'page', title:String(i.title || '').trim().slice(0, 160), blocks:toBlocks(i.blocks) };
      if (!page.blocks.length) page.blocks.push(newBlock('p'));
      arr.push(page); touch(k); refreshTree(k); log('file', 'Создана страница в «' + SECTIONS[k].title + '»: ' + (page.title || 'Без названия')); return { ok:true, id:page.id };
    }),
    T('append_to_page', 'Append blocks to the end of an existing page.', { id:{ type:'string' }, blocks:{ type:'array', items:{ type:'object', properties:{ type:{ type:'string', enum:BLOCK_TYPES }, text:{ type:'string' }, done:{ type:'boolean' } }, required:['text'] } } }, ['id', 'blocks'], i => {
      const l = findAnyNode(i.id); if (!l || l.node.type !== 'page') throw new Error('Page not found: ' + i.id);
      const nb = toBlocks(i.blocks); const bl = l.node.blocks;
      if (bl.length === 1 && !bl[0].text) bl.length = 0;
      l.node.blocks.push(...nb); touch(l.k); refreshTree(l.k); if (editing && editing.id === i.id) editorSync();
      log('file', 'Дополнена страница: ' + (l.node.title || 'Без названия')); return { ok:true, added:nb.length };
    }),
    T('read_board', 'Read all cards on the board of a page from "plans" or "ideas": notes (text), checklists (title, items), images/videos (file name, caption), sketches, links. Card ids are needed for look_at_image.', { pageId:{ type:'string' } }, ['pageId'], async i => {
      const p = boardPage(i.pageId);
      const cards = await boardApi.readBoard(ownerKey(p));
      log('board', 'Прочитана доска: ' + (p.title || 'Без названия') + ' (карточек: ' + cards.length + ')');
      return { page:p.title, cards };
    }),
    T('add_board_card', 'Add a note or a checklist card to the board of a page from "plans" or "ideas". For type "checklist": if text has several lines, the first line is the title and every other line is an item ("[x] " prefix = done). x/y are optional board coordinates; without them the card is placed in free space without overlapping other cards.', { pageId:{ type:'string' }, type:{ type:'string', enum:['note', 'checklist'] }, text:{ type:'string' }, x:{ type:'number' }, y:{ type:'number' } }, ['pageId', 'type', 'text'], async i => {
      const p = boardPage(i.pageId), text = String(i.text || '').trim(); if (!text) throw new Error('text is empty');
      const it = await boardApi.addCard(ownerKey(p), i.type === 'checklist' ? 'checklist' : 'note', text.slice(0, 8000), i.x, i.y);
      log('board', (it.type === 'checklist' ? 'Чек-лист' : 'Заметка') + ' добавлен' + (it.type === 'checklist' ? '' : 'а') + ' на доску «' + (p.title || 'Без названия') + '»');
      return { ok:true, id:it.id };
    }),
    T('look_at_image', 'Look at an image or sketch card from a task board (the picture is sent to you). Use ONLY when the user explicitly asks to look at, describe or analyze a picture. Get card ids from read_board.', { cardId:{ type:'string' } }, ['cardId'], async i => {
      if (!boardApi) throw new Error('Boards are not available');
      const f = await boardApi.findCard(String(i.cardId || ''));
      if (!f) throw new Error('Card not found: ' + i.cardId);
      const it = f.item;
      if (it.type !== 'image' && !(it.type === 'sketch' && it.mediaId)) throw new Error('This card is not an image (type: ' + it.type + ')');
      const img = await boardApi.imageForAI(it);
      const label = it.type === 'sketch' ? 'зарисовка' : (it.caption || it.name || 'изображение');
      log('eye', 'Отправляю ассистенту картинку: ' + label + ' (' + img.width + '×' + img.height + ', JPEG)', it.type === 'image' && it.thumb ? boardApi.thumbUrl(it.mediaId) : boardApi.mediaUrl(it.mediaId));
      return { __content:[
        { type:'image', source:{ type:'base64', media_type:img.mediaType, data:img.data } },
        { type:'text', text:'Карточка ' + it.id + ' (' + (it.type === 'sketch' ? 'зарисовка' : 'изображение') + (it.name ? ', файл «' + it.name + '»' : '') + (it.caption ? ', подпись «' + it.caption + '»' : '') + (it.overlay ? ', поверх нарисованы пометки' : '') + ')' }
      ] };
    })
  ];
}
async function aiSend(text){
  if (aiBusy || !sample) return;
  aiBusy = true; aiChips.hidden = true;
  aiSendBtn.replaceChildren(icon('stop', 16)); aiSendBtn.setAttribute('aria-label', 'Остановить');
  addMsg('user', text);
  const bot = addMsg('bot', ''); const md = bot.querySelector('.md'); md.className = 'md thinking';
  const logEl = bot.querySelector('.acts-log');
  const msgs = aiHistory.slice(-10).concat([{ role:'user', content:buildPrompt(text) }]);
  aiCtrl = new AbortController();
  try {
    const res = await sample(msgs, {
      tools:aiTools(logEl), cache:false, modelTier:'default', signal:aiCtrl.signal,
      onText:({ text:t }) => { md.className = 'md'; md.innerHTML = mdLite(t); aiMsgs.scrollTop = aiMsgs.scrollHeight; }
    });
    md.className = 'md';
    const final = (res && res.text) || '';
    md.innerHTML = mdLite(final || (logEl.children.length ? 'Готово.' : '…'));
    aiHistory.push({ role:'user', content:text }, { role:'assistant', content:final || 'Готово.' });
  } catch (e) {
    md.className = 'md';
    const code = e && e.code;
    const partial = e && e.text ? mdLite(e.text) : '';
    md.innerHTML = partial + '<p><i>' + (code === 'not_granted' ? 'Нет доступа к ИИ: разрешите его (или проверьте ключ API) и повторите.' : code === 'rate_limited' ? 'Слишком много запросов — подождите немного.' : (aiCtrl && aiCtrl.signal.aborted) ? 'Остановлено.' : 'Не удалось получить ответ. Попробуйте ещё раз.') + '</i></p>';
  } finally {
    aiBusy = false; aiCtrl = null;
    aiSendBtn.replaceChildren(icon('up', 18)); aiSendBtn.setAttribute('aria-label', 'Отправить');
    aiMsgs.scrollTop = aiMsgs.scrollHeight;
  }
}
async function initAI(){
  try { if (window.claude && window.claude.use) sample = await window.claude.use('sample'); } catch (e) { sample = null; }
  if (!sample) return;
  buildAiPanel();
  aiBtn.append(icon('spark', 15), 'Ассистент'); aiBtn.hidden = false;
  aiBtn.addEventListener('click', () => aiPanel.classList.contains('open') ? closeAi() : openAi());
}

/* ---------- task boards ---------- */
function createBoards(){
  if (!window.PlanerBoard) return null;
  return window.PlanerBoard.create({
    h, icon, IC, toast, openMenu, closeMenu, isMenuOpen:() => !!menuEl,
    electron:window.electronAPI || null,
    store:extraStore, pending:pendingSave,
    saveError:e => { setStatus('error'); showBanner('Не удалось сохранить доску: ' + ((e && (e.code || e.message)) || 'ошибка') + '. Изменения остаются на экране.'); },
    // ключ доски = id страницы (или boardId страницы, перенесённой со старой задачи)
    getTask:key => { const l = findOwner(key); return l ? { id:key, text:l.node.title, boardCount:l.node.boardCount | 0 } : null; },
    taskSection:key => { const l = findOwner(key); return l ? l.k : null; },
    sectionTitle:k => SECTIONS[k] ? SECTIONS[k].title : '',
    setTaskText(key, text){
      const l = findOwner(key); if (!l || l.node.title === text) return;
      l.node.title = String(text).slice(0, 160); touch(l.k); refreshTree(l.k);
      if (editing && editNode() === l.node && document.activeElement !== titleEl) titleEl.value = l.node.title;
    },
    setBoardCount(key, n){ const l = findOwner(key); if (!l || (l.node.boardCount | 0) === n) return; l.node.boardCount = n; touch(l.k); refreshTree(l.k); },
    allBoardTaskIds:() => { const out = []; const walk = arr => arr.forEach(n => { if (n.type === 'folder') walk(n.children); else if (n.boardCount > 0) out.push(ownerKey(n)); }); walk(S.plans.nodes); walk(S.ideas.nodes); return out; },
    toggleAi:() => { if (!sample) { toast('Ассистент недоступен.'); return; } aiPanel.classList.contains('open') ? closeAi() : openAi(); },
    onClosed:key => { const l = findOwner(key); if (l) refreshTree(l.k); }
  });
}

/* ---------- global keys & boot ---------- */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (menuEl) closeMenu();
  else if (overlayEl) closeEditor();
  else if (dayView) closeDay();
  else if (aiPanel.classList.contains('open')) closeAi();
});
if ('ResizeObserver' in window) new ResizeObserver(debounce(autosizeAll, 80)).observe(board);
// Файл, случайно брошенный мимо доски, не должен открываться вместо приложения.
['dragover', 'drop'].forEach(t => document.addEventListener(t, e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); }));

(async function main(){
  try { boardApi = createBoards(); } catch (e) { console.error('board:', e); boardApi = null; }
  const ea = window.electronAPI;
  if (ea && ea.onFlush) ea.onFlush(flushEverything);
  if (ea && ea.onStoreError) ea.onStoreError(m => { setStatus('error'); showBanner(m); });
  buildBoard();
  KEYS.forEach(refreshSection);
  setStatus('loading');
  await initBackend();
  await loadAll();
  if (!calSeen) { try { await migrateLegacy(); } catch (e) { console.error('migrate:', e); } }
  loaded = true;
  KEYS.forEach(refreshSection);
  board.classList.remove('loading');
  idleStatus();
  initAI();
  if (ea && ea.notices) { try { const list = await ea.notices(); if (list && list.length) showBanner(list.join(' ')); } catch (e) {} }
})();
})();
</script>
