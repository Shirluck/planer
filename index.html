<div id="app">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Планер</div>
    <button class="tm-btn" id="timerBtn" type="button" hidden></button>
    <button class="tm-btn" id="memoryBtn" type="button" aria-label="Память"></button>
    <button class="tm-btn" id="developmentBtn" type="button" aria-label="Развитие"></button>

    <button class="tm-btn" id="headerMore" type="button" aria-haspopup="true">Ещё</button>
    <button class="search-btn" id="searchBtn" type="button" hidden></button>
    <div class="status" id="status" data-s="busy" role="status" aria-live="polite">Загрузка…</div>
    <button class="tool hdr-tool" id="settingsBtn" type="button" hidden></button>

  <div class="banner" id="banner" hidden></div>
